name: Desktop build (Windows + Linux)

# CrunchyVFX's release pipeline (RELEASE.md), the same shape as CrunchySFX's (shipped three times) and CrunchyTile's.
#
# Builds native installers on a version tag (v1.2.3), and on demand from the Actions tab. Produces a DRAFT GitHub
# Release with the installers attached: the Windows .exe (NSIS) and the Linux .deb, which is wrapped as the Flatpak
# (the Linux product). No AppImage: its bundled GStreamer/GL can't reach a rolling distro's PipeWire or a new GPU
# (CrunchySFX 1.2.1: no sound on CachyOS, 2026-10-16; blank pages on bleeding-edge GPUs before that).
#
# On a TAG push it ALSO uploads to itch.io via butler (Windows installer + Linux Flatpak), so the paid binaries never
# sit on a public surface. The GitHub release stays a DRAFT on purpose: NEVER click "Publish release", or the paid
# installers become free public downloads.
#
# WHY ubuntu-22.04 AND NOT ubuntu-latest. A Linux binary needs whatever glibc it was BUILT against: a build on
# CachyOS (glibc 2.43) requires GLIBC_2.39, which neither Ubuntu 22.04 (2.35) nor the GNOME 46 Flatpak runtime
# has. ubuntu-22.04 is the oldest runner that still has webkit2gtk-4.1, so it is the floor. Measured, not assumed.
#
# The frontend is copied into dist/ by src-tauri/build.rs (every sibling is listed in its FRONTEND, and a missing one
# panics), so there is no separate copy step here to keep in step with it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  ITCH_TARGET: sevi66/crunchyvfx # <itch-user>/<project-slug>: must match the itch page URL

jobs:
  build:
    permissions:
      contents: write # needed to create the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04 # Linux: .deb (wrapped as the Flatpak; 22.04 for glibc 2.35)
          - platform: windows-latest # Windows: .exe (NSIS)
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      # One version everywhere it lives (tests/build.py exits non-zero on drift), and every crunchyCore copy intact,
      # byte for byte (pull-core --check: 0 intact; 3 intact but crunchyCore is not beside this checkout, which is CI;
      # 1 corrupt, e.g. a CRLF checkout: see .gitattributes). PYTHONUTF8: Windows' Python reads cp1252 otherwise.
      - name: Check the wiring (versions agree, core copies intact)
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          PY=python3; command -v python3 >/dev/null && python3 -c "" 2>/dev/null || PY=python
          "$PY" tests/build.py
          set +e; node tools/pull-core.mjs --check; s=$?; set -e
          [ "$s" -eq 0 ] || [ "$s" -eq 3 ] || { echo "::error::pull-core --check failed ($s)"; exit 1; }

      - name: Set up Rust (official stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # Tauri checks frontendDist (../dist) exists BEFORE cargo runs build.rs, which is what fills it. dist/ is not
      # committed, so a fresh checkout needs the folder first.
      - name: Create the frontend folder (build.rs fills it)
        shell: bash
        run: mkdir -p dist

      - name: Build the app + create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CrunchyVFX ${{ github.ref_name }}"
          releaseBody: "Desktop builds of CrunchyVFX. Windows installer + Linux .deb attached below (the Flatpak ships on itch)."
          releaseDraft: true
          prerelease: false

      # ---- Windows to itch.io (purchase-gated, never public). Tag pushes only: a manual run cannot ship. ----
      - name: Install butler (itch.io CLI)
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # broth.itch.ovh was retired; broth.itch.zone is the host. curl.exe retries transient CDN errors.
          curl.exe -sL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 -o butler.zip https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default
          Expand-Archive -Force butler.zip -DestinationPath butler-bin
          "$PWD\butler-bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Push Windows build to itch.io
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::warning::BUTLER_API_KEY secret is not set: skipping the itch.io upload."
            exit 0
          fi
          butler -V
          # the glob is UNQUOTED so the shell expands it
          butler push src-tauri/target/release/bundle/nsis/CrunchyVFX_*_x64-setup.exe \
            "$ITCH_TARGET:windows" --userversion "${GITHUB_REF_NAME#v}"
          butler status "$ITCH_TARGET"

      # ---- Linux: the CI-built .deb wrapped as a Flatpak, which is what ships. The Flatpak runtime brokers the host's
      # GPU drivers and audio; building on ubuntu-22.04 keeps the .deb's glibc old enough for any runtime (GNOME 50 since 1.1.0). ----
      - name: Install flatpak tooling + runtime
        if: matrix.platform == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags/v')
        run: |
          # flatpak + flatpak-builder from Flatpak's own PPA (1.4.x): Ubuntu 22.04's flatpak-builder 1.2 calls
          # appstream-compose, which the GNOME 50 SDK no longer has. The exact setup CrunchyShader 1.0.3 shipped with
          # (proved in an ubuntu:22.04 container as a non-root user, 2026-10-24).
          sudo add-apt-repository -y ppa:flatpak/stable
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak-builder --version
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # ~1.5 GB download; the slowest step in this job.
          flatpak install -y --user flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Build the Flatpak bundle
        if: matrix.platform == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The manifest takes the .deb as its source: see flatpak/com.crunchyvfx.app.yml
          cp src-tauri/target/release/bundle/deb/*.deb flatpak/crunchyvfx.deb
          cd flatpak
          # --disable-rofiles-fuse: CI runners can't always use FUSE for the build overlay.
          flatpak-builder --force-clean --user --disable-rofiles-fuse \
            --repo=repo build-dir com.crunchyvfx.app.yml
          flatpak build-bundle repo "CrunchyVFX-${VERSION}.flatpak" com.crunchyvfx.app
          ls -la ./*.flatpak

      - name: Install butler (itch.io CLI)
        if: matrix.platform == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags/v')
        run: |
          curl -sL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
            -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -o butler.zip -d "$HOME/butler-bin"
          chmod +x "$HOME/butler-bin/butler"
          echo "$HOME/butler-bin" >> "$GITHUB_PATH"

      - name: Push Linux (Flatpak) to itch.io
        if: matrix.platform == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags/v')
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::warning::BUTLER_API_KEY secret is not set: skipping the itch.io upload."
            exit 0
          fi
          butler -V
          butler push flatpak/CrunchyVFX-*.flatpak \
            "$ITCH_TARGET:linux-flatpak" --userversion "${GITHUB_REF_NAME#v}"
          butler status "$ITCH_TARGET"
