name: Desktop build (Windows + Linux)

# Builds native installers on a version tag (v1.2.3), and on demand from the Actions tab.
# Produces a DRAFT GitHub Release with the installers attached, and pushes the Windows build
# straight to itch.io so paid binaries never sit on a public URL.
#
# NEVER click "Publish release" on the draft — that would make the paid installers a free
# public download. The draft exists so you can grab artefacts, not to publish them.
#
# WHY ubuntu-22.04 AND NOT ubuntu-latest — this is the whole reason CI exists for this project.
# A Linux binary needs whatever glibc it was BUILT against. Building on a modern desktop distro
# produces something most buyers cannot run:
#
#     built on CachyOS (glibc 2.43)  ->  binary requires GLIBC_2.39
#     Ubuntu 22.04 LTS has 2.35  ·  Debian 12 has 2.36   ->  will not start
#
# ubuntu-22.04 (glibc 2.35) is the oldest runner that still has webkit2gtk-4.1, so it is the
# floor. Measured on this project, not assumed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  ITCH_TARGET: sevi66/crunchyvfx # <itch-user>/<project-slug> — must match the itch page URL

jobs:
  build:
    permissions:
      contents: write # needed to create the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04 # Linux: .deb + .AppImage
          - platform: windows-latest # Windows: .exe (NSIS)
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # src-tauri/build.rs copies these into ../dist itself; doing it here too means a missing
      # file fails at this step with an obvious message rather than as a blank window at runtime.
      - name: Prepare frontend
        shell: bash
        run: |
          mkdir -p dist
          cp index.html styles.css presets.js shapes.js vfx.js gif.js apng.js crunchysfx-synth.js dist/

      - name: Install Linux webview deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - name: Set up Rust (official stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # linuxdeploy ships as an AppImage and self-mounts via libfuse2. Runners have it, but this
      # costs nothing and makes the job work on hosts that dropped FUSE 2 (every modern Arch-based
      # distro, including the machine this was developed on, where the AppImage bundle fails with
      # `dlopen(): error loading libfuse.so.2`).
      - name: Build the app + create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CrunchyVFX ${{ github.ref_name }}"
          releaseBody: "Desktop builds of CrunchyVFX. Windows installer + Linux .deb/.AppImage attached below."
          releaseDraft: true
          prerelease: false

      # ---- Windows -> itch.io (purchase-gated, never a public URL) ----
      # Tag pushes only, so a manual "Run workflow" cannot accidentally ship to the store.
      - name: Install butler (itch.io CLI)
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # butler moved hosts: broth.itch.ovh was RETIRED (now NXDOMAIN) -> use broth.itch.zone.
          # curl.exe (bundled on the runner) retries transient CDN hiccups; Invoke-WebRequest does not.
          curl.exe -sL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 -o butler.zip https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default
          Expand-Archive -Force butler.zip -DestinationPath butler-bin
          "$PWD\butler-bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Push Windows build to itch.io
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::warning::BUTLER_API_KEY secret is not set — skipping the itch.io upload."
            exit 0
          fi
          butler -V
          # NOTE: glob is UNQUOTED so the shell expands it; quoting passes a literal '*' to butler.
          butler push src-tauri/target/release/bundle/nsis/CrunchyVFX_*_x64-setup.exe \
            "$ITCH_TARGET:windows" --userversion "${GITHUB_REF_NAME#v}"
          butler status "$ITCH_TARGET"

      # ---- Linux: wrap the CI-built .deb into a Flatpak, and ship THAT ----
      # Flatpak, not the AppImage, is the Linux product: its runtime brokers the host GPU drivers,
      # which is what fixes the WebKitGTK blank-page bug on bleeding-edge distros. Building here on
      # ubuntu-22.04 is also REQUIRED — a .deb built on a newer host needs a glibc the GNOME 46
      # runtime doesn't have (measured: a local CachyOS build wants GLIBC_2.39).
      - name: Install flatpak tooling + runtime
        if: matrix.platform == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags/v')
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # ~1.5 GB download; the slowest step in this job.
          flatpak install -y --user flathub org.gnome.Platform//46 org.gnome.Sdk//46

      - name: Build the Flatpak bundle
        if: matrix.platform == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp src-tauri/target/release/bundle/deb/*.deb flatpak/crunchyvfx.deb
          cd flatpak
          # --disable-rofiles-fuse: CI runners can't always use FUSE for the build overlay.
          flatpak-builder --force-clean --user --disable-rofiles-fuse \
            --repo=repo build-dir com.crunchyvfx.app.yml
          flatpak build-bundle repo "CrunchyVFX-${VERSION}.flatpak" com.crunchyvfx.app
          ls -la ./*.flatpak

      - name: Install butler (itch.io CLI)
        if: matrix.platform == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags/v')
        run: |
          # butler moved hosts: broth.itch.ovh was RETIRED (now NXDOMAIN) -> use broth.itch.zone.
          curl -sL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
            -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -o butler.zip -d "$HOME/butler-bin"
          chmod +x "$HOME/butler-bin/butler"
          echo "$HOME/butler-bin" >> "$GITHUB_PATH"

      - name: Push Linux (Flatpak) to itch.io
        if: matrix.platform == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags/v')
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::warning::BUTLER_API_KEY secret is not set — skipping the itch.io upload."
            exit 0
          fi
          butler -V
          butler push flatpak/CrunchyVFX-*.flatpak \
            "$ITCH_TARGET:linux-flatpak" --userversion "${GITHUB_REF_NAME#v}"
          butler status "$ITCH_TARGET"

      # ---- The .AppImage rides along on the draft release only ----
      # CrunchySFX ships Flatpak as its Linux product, not the AppImage: the Flatpak runtime
      # brokers host GPU drivers, so it works on bleeding-edge distros (Arch/CachyOS/Steam Deck)
      # where an AppImage's bundled GL libs blank-screen. That needs a flatpak/ manifest, which
      # this project does not have yet — see VFX-DESIGN.md §14.
      #
      # Until then the .deb and .AppImage are attached to the DRAFT release only, so they can be
      # tested on a normal machine before anyone is asked to pay for them. Do not shortcut this:
      # the AppImage has never been verified on a non-bleeding-edge host.
      - name: Note the Linux artefacts
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          echo "Linux artefacts are attached to the draft release for manual testing."
          ls -la src-tauri/target/release/bundle/deb/ || true
          ls -la src-tauri/target/release/bundle/appimage/ || true
